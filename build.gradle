plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = '1.0.0'
group = 'com.knvoz.avaritiatinkersfix'
base {
    archivesName = 'AvaritiaTinkersFix-1.12.2'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name 'CurseMaven'
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

dependencies {
    implementation rfg.deobf('curse.maven:tinkers-antique-1242239:8666425')
    implementation rfg.deobf('curse.maven:avaritia-1-1x-unofficial-1165010:7939693')
    implementation rfg.deobf('codechicken:CodeChickenLib:1.12.2-3.2.3.358:universal')
    implementation rfg.deobf('curse.maven:mantle-74924:2713386')

    compileOnly 'zone.rong:mixinbooter:10.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.knvoz.avaritiatinkersfix.core.AvaritiaTinkersFixCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
